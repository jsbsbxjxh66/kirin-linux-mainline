%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/huawei,flash-led.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Huawei LM3642/MP3331/AW3642 flash and torch LED

maintainers:
  - opencode <opencode@localhost>

description: |
  Several pin-compatible flash LED controllers are used across Huawei phone
  revisions.  The controller is identified from its chip ID register at probe
  time, so a single compatible covers all of them.

properties:
  compatible:
    const: huawei,flash-led

  reg:
    maxItems: 1

  led:
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    required:
      - flash-max-microamp
      - flash-max-timeout-us

required:
  - compatible
  - reg
  - led

additionalProperties: false

examples:
  - |
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        flash@63 {
            compatible = "huawei,flash-led";
            reg = <0x63>;

            led {
                function = LED_FUNCTION_FLASH;
                color = <LED_COLOR_ID_WHITE>;
                flash-max-microamp = <1500000>;
                flash-max-timeout-us = <600000>;
                led-max-microamp = <375000>;
            };
        };
    };
