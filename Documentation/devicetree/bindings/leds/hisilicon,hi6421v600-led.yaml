%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/hisilicon,hi6421v600-led.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hi6421v600 PMIC LED controller

maintainers:
  - opencode <opencode@localhost>

description: |
  The Hi6421v600 PMIC exposes three LED current sinks (red, green and blue).
  Each sink has its own ISET, start-delay and time-config registers, while
  enable and output control are shared.

properties:
  compatible:
    const: hisilicon,hi6421v600-led

  hisilicon,ctrl-reg:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Register offset of the global LED enable register.

  hisilicon,out-ctrl-reg:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Register offset of the LED output control register.

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^led@[0-2]$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        description: Index of the LED current sink.
        minimum: 0
        maximum: 2

      hisilicon,max-current:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Value written to the ISET register for full brightness.

required:
  - compatible
  - hisilicon,ctrl-reg
  - hisilicon,out-ctrl-reg
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/leds/common.h>

    led-controller {
        compatible = "hisilicon,hi6421v600-led";
        #address-cells = <1>;
        #size-cells = <0>;
        hisilicon,ctrl-reg = <0x12f>;
        hisilicon,out-ctrl-reg = <0x133>;

        led@0 {
            reg = <0>;
            color = <LED_COLOR_ID_RED>;
            function = LED_FUNCTION_STATUS;
            hisilicon,max-current = <4>;
        };

        led@1 {
            reg = <1>;
            color = <LED_COLOR_ID_GREEN>;
            function = LED_FUNCTION_STATUS;
            hisilicon,max-current = <0>;
        };

        led@2 {
            reg = <2>;
            color = <LED_COLOR_ID_BLUE>;
            function = LED_FUNCTION_STATUS;
            hisilicon,max-current = <2>;
        };
    };
