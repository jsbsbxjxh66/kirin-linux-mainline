%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/hisilicon,codecssi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hisilicon Hi64xx SSI register interface

maintainers:
  - Wei Xu <xuwei5@hisilicon.com>

description:
  The codecssi node owns the SSI pin configuration used when the Hi64xx codec
  controller accesses the codec over the SSI bus. It shares the register
  window with the codec controller but only manages the SSI pins.

properties:
  compatible:
    const: hisilicon,codecssi

  reg:
    maxItems: 1

  pinctrl-names:
    items:
      - const: default
      - const: idle

  pinctrl-0: true

  pinctrl-1: true

required:
  - compatible
  - reg

additionalProperties: false
