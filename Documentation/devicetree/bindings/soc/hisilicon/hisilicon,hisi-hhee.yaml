%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/hisilicon/hisilicon,hisi-hhee.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon HHEE hypervisor interface

maintainers:
  - Wei Xu <xuwei5@hisilicon.com>

description: |
  The HiSilicon Hypervisor Execution Environment (HHEE) runs at EL2 and
  reports exceptions and firmware messages to the non-secure kernel through
  a shared message queue.  The kernel acknowledges messages through the
  interrupt described below.

properties:
  compatible:
    const: hisilicon,hisi-hhee

  interrupts:
    maxItems: 1

required:
  - compatible
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    hhee {
        compatible = "hisilicon,hisi-hhee";
        interrupts = <GIC_SPI 350 IRQ_TYPE_LEVEL_HIGH>;
    };
