%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/hisilicon/hisilicon,sochifi-watchdog.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hisilicon Kirin SoC HiFi watchdog

maintainers:
  - Wei Xu <xuwei5@hisilicon.com>

description:
  The SoC HiFi watchdog interrupt is used by the HiFi DSP reset and error
  reporting path. The watchdog is programmed by firmware; the AP only consumes
  the interrupt.

properties:
  compatible:
    const: hisilicon,sochifi-watchdog

  interrupts:
    maxItems: 1

required:
  - compatible
  - interrupts

additionalProperties: false
