%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/hisilicon/hisilicon,hw-vote.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon hardware frequency vote aggregator

maintainers:
  - Wei Xu <xuwei5@hisilicon.com>

description: |
  The HiSilicon PMCTRL block aggregates frequency votes from several
  masters and exposes the winning value.  Each channel describes one
  frequency domain (for example a CPU cluster or the GPU); the vote
  sources below a channel are the individual register fields written by
  consumers.

properties:
  compatible:
    const: hisi,freq-hw-vote

  reg:
    maxItems: 1
    description: PMCTRL register window containing the vote registers.

  "#address-cells":
    const: 2

  "#size-cells":
    const: 2

  ranges: true

patternProperties:
  '^[a-z0-9-]+-freq$':
    type: object
    description: A frequency domain and its vote sources.

    properties:
      result_reg:
        $ref: /schemas/types.yaml#/definitions/uint32-array
        minItems: 3
        maxItems: 3
        description:
          Register offset, read mask and write mask of the aggregated
          result register.

      ratio:
        $ref: /schemas/types.yaml#/definitions/uint32
        default: 1
        description: Frequency encoding ratio for this channel.

    patternProperties:
      '^vote-src-[0-9]+$':
        type: object
        description: One vote register field owned by a consumer.

        properties:
          vote_reg:
            $ref: /schemas/types.yaml#/definitions/uint32-array
            minItems: 3
            maxItems: 3
            description:
              Register offset, read mask and write mask of the vote
              register field.

        required:
          - vote_reg

        additionalProperties: false

    required:
      - result_reg

    additionalProperties: false

required:
  - compatible
  - reg

additionalProperties: false
