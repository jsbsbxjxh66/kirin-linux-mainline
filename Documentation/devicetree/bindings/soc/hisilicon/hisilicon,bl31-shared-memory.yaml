%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/hisilicon/hisilicon,bl31-shared-memory.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon BL31 shared memory windows

maintainers:
  - Wei Xu <xuwei5@hisilicon.com>

description: |
  The ARM Trusted Firmware BL31 exposes a small shared memory window to the
  non-secure world.  Each child node describes a window inside that region;
  the child reg property holds an offset and a size relative to
  HISI_SUB_RESERVED_BL31_SHARE_MEM_PHYMEM_BASE, not a CPU address.

properties:
  compatible:
    const: hisilicon,bl31-shared-memory

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

patternProperties:
  "^[a-z0-9-]+@[0-9a-f]+$":
    type: object
    properties:
      compatible:
        enum:
          - hisi,share-memory-drm
      reg:
        maxItems: 1
        description: Offset and size inside the BL31 shared window.
    required:
      - compatible
      - reg
    additionalProperties: false

required:
  - compatible
  - "#address-cells"
  - "#size-cells"

additionalProperties: false
