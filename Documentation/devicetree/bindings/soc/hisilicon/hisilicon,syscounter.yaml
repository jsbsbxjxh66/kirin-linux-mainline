%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/hisilicon/hisilicon,syscounter.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon always-on system counter

maintainers:
  - Wei Xu <xuwei5@hisilicon.com>

description: |
  The HiSilicon system counter runs from the always-on clock and keeps
  counting across CPU and system suspend.  Firmware and remote processors
  use it to timestamp events.

properties:
  compatible:
    const: hisilicon,syscounter-driver

  reg:
    maxItems: 1

  clock-rate:
    $ref: /schemas/types.yaml#/definitions/uint64
    description: Counter clock rate in Hz.

  sync-interval:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Optional periodic resynchronization interval in ms.

required:
  - compatible
  - reg
  - clock-rate

additionalProperties: false
