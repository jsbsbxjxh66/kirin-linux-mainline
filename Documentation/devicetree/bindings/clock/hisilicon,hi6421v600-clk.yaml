%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/hisilicon,hi6421v600-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi6421v600 PMIC audio clock gate

maintainers:
  - Mauro Carvalho Chehab <mchehab+huawei@kernel.org>

description: |
  The Hi6421v600 PMIC exposes a single audio clock gate in its SPMI register
  space.  The gate is controlled by a bit in an 8-bit PMIC register and is
  used as the parent clock of the Hi6403 codec controller and SLIMbus.

  The node must be a child of the Hi6421v600 PMIC MFD node, because the
  driver obtains the SPMI regmap from its parent device.

properties:
  compatible:
    const: hisilicon,hi6421v600-clk

  '#clock-cells':
    const: 0

  clocks:
    maxItems: 1

  clock-output-names:
    maxItems: 1

  hisilicon,clkgate:
    description:
      PMIC register offset and bit number controlling the gate.
    $ref: /schemas/types.yaml#/definitions/uint32-array
    items:
      - description: 8-bit PMIC register offset
      - description: gate bit, 0..7
    minItems: 2
    maxItems: 2

required:
  - compatible
  - '#clock-cells'
  - clocks
  - clock-output-names
  - hisilicon,clkgate

additionalProperties: false

examples:
  - |
    clk_24m: clock-24m {
        compatible = "fixed-clock";
        #clock-cells = <0>;
        clock-frequency = <19200000>;
    };

    pmic {
        #address-cells = <1>;
        #size-cells = <0>;

        clock {
            compatible = "hisilicon,hi6421v600-clk";
            #clock-cells = <0>;
            clocks = <&clk_24m>;
            clock-output-names = "clk_pmuaudioclk";
            hisilicon,clkgate = <0x3d 0>;
        };
    };
...
