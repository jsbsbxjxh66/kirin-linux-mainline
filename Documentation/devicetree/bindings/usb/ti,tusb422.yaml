%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/ti,tusb422.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments TUSB422 Type-C Port Controller

maintainers:
  - opencode <opencode@localhost>

description: |
  The TUSB422 is a TCPCI-compliant Type-C port controller with USB Power
  Delivery support.  It is connected over I2C and raises an active-low alert
  interrupt when the Type-C or PD state changes.

properties:
  compatible:
    const: ti,tusb422

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  connector:
    type: object
    $ref: /schemas/connector/usb-connector.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - connector

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/usb/pd.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        tusb422@20 {
            compatible = "ti,tusb422";
            reg = <0x20>;
            interrupt-parent = <&gpio27>;
            interrupts = <5 IRQ_TYPE_LEVEL_LOW>;

            connector {
                compatible = "usb-c-connector";
                label = "USB-C";
                power-role = "dual";
                data-role = "dual";
                try-power-role = "sink";
                typec-power-opmode = "default";
            };
        };
    };
