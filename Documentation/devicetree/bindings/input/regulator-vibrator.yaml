%YAML 1.2
---
$id: http://devicetree.org/schemas/input/regulator-vibrator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Regulator vibrator

maintainers:
  - opencode <opencode@localhost>

description: |
  A vibrator motor whose power is enabled and disabled through a regulator.

properties:
  compatible:
    const: regulator-vibrator

  vcc-supply:
    description: Regulator that powers the vibrator motor.

  vibrator-voltage-microvolt:
    description: Optional voltage to configure on the supply when present.

required:
  - compatible
  - vcc-supply

additionalProperties: false

examples:
  - |
    vibrator {
        compatible = "regulator-vibrator";
        vcc-supply = <&ldo17>;
        vibrator-voltage-microvolt = <3000000>;
    };
